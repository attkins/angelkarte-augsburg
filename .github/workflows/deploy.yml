name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Operator for the imprint, kept out of the repository (Settings, Secrets and variables, Actions).
      VITE_IMPRINT_NAME: ${{ secrets.VITE_IMPRINT_NAME }}
      VITE_IMPRINT_STREET: ${{ secrets.VITE_IMPRINT_STREET }}
      VITE_IMPRINT_CITY: ${{ secrets.VITE_IMPRINT_CITY }}
      VITE_IMPRINT_EMAIL: ${{ secrets.VITE_IMPRINT_EMAIL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run validate
      - name: Check imprint secrets
        # The imprint must not go live empty.
        run: |
          for name in VITE_IMPRINT_NAME VITE_IMPRINT_STREET VITE_IMPRINT_CITY VITE_IMPRINT_EMAIL; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository secret $name is not set"
              exit 1
            fi
          done
      - run: npm run build
        env:
          VITE_CARTO_API_KEY: ${{ vars.VITE_CARTO_API_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
