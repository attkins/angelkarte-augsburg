# Configuration for git-cliff, see https://git-cliff.org/docs/configuration
# Generates CHANGELOG.md from the Conventional Commits: npm run changelog

[changelog]
header = """
# Changelog

All notable changes to the Angelkarte. Generated from the commit messages with git-cliff, edits by hand get lost on the next run.

"""
body = """
{% if version %}\
## {{ version | trim_start_matches(pat="v") }} ({{ timestamp | date(format="%Y-%m-%d") }})
{% else %}\
## Unreleased
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {{ commit.message | split(pat="\n") | first | trim | upper_first }} \
([{{ commit.id | truncate(length=7, end="") }}](https://github.com/attkins/angelkarte-augsburg/commit/{{ commit.id }}))\
{% endfor %}
{% endfor %}
"""
trim = true

[git]
conventional_commits = true
# Commits that do not follow the convention are left out.
filter_unconventional = true
split_commits = false
# The HTML comments only sort the groups, they are stripped from the headings.
commit_parsers = [
  { message = "^chore\\(release\\)", skip = true },
  { message = "^feat\\(data\\)", group = "<!-- 1 -->Data" },
  { message = "^fix\\(data\\)", group = "<!-- 1 -->Data" },
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 2 -->Fixes" },
  { message = "^(refactor|perf|style)", group = "<!-- 3 -->Changes under the hood" },
  { message = "^docs", group = "<!-- 4 -->Documentation" },
  { message = "^test", group = "<!-- 5 -->Tests" },
  { message = "^(build|ci|chore)", group = "<!-- 6 -->Build and maintenance" },
]
filter_commits = false
tag_pattern = "v[0-9].*"
sort_commits = "oldest"

[bump]
# git-cliff reads versions from the git tags only, never from package.json.
# Without any tag yet, --bump starts here. package.json was at 0.2.0 before the first tag.
initial_tag = "v0.3.0"
