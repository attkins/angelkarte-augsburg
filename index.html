<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <!-- App icons, rendered from the header logo with scripts/icons.py. -->
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="icon" href="/icons/icon-192.png" sizes="192x192" type="image/png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <!-- Colour of the browser and status bar, the map background (--land). Set for the stored theme below. -->
  <meta name="theme-color" content="#e7ece5">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Angelkarte">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Angelkarte Augsburg</title>
  <meta name="description" content="Interaktive Karte für Augsburg und Umland: welcher Verein Tageskarten verkauft, wo es sie gibt und ob Gäste allein fischen dürfen.">
  <!-- Link preview in messengers and social networks. Crawlers need absolute URLs and ignore the #/... routes,
       so every shared link shows this card. Regenerate the image with scripts/og-image.py. -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Angelkarte Augsburg">
  <meta property="og:title" content="Angelkarte Augsburg und Umland">
  <meta property="og:description" content="Welcher Verein verkauft wo eine Tageskarte, und dürfen Gäste allein fischen?">
  <meta property="og:url" content="https://attkins.github.io/angelkarte-augsburg/">
  <meta property="og:image" content="https://attkins.github.io/angelkarte-augsburg/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Karte der Angelgewässer rund um Augsburg mit dem Schriftzug Angelkarte">
  <meta property="og:locale" content="de_DE">
  <meta name="twitter:card" content="summary_large_image">
  <script>
    // Set the theme before the first paint so the page does not flash light in dark mode.
    // useTheme() takes over once the app has started.
    try {
      var stored = localStorage.getItem('angelkarte-theme')
      var dark = stored ? stored === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches
      document.documentElement.dataset.theme = dark ? 'dark' : 'light'
      // Same colours as THEME_COLORS in src/composables/useTheme.ts.
      document.querySelector('meta[name="theme-color"]').content = dark ? '#151e1c' : '#e7ece5'
    } catch (e) {}
  </script>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
